<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="CSS/styles.css">
    <script src="JS/usuarios.js" defer></script>
    <script src="JS/login.js" defer></script>
</head>

<body>

    <header class="encabezado">
        <h1>Iniciar Sesión</h1>
        <p class ="subtitulo">Ingresa tus datos</p>
        
        <nav>
            <a href="index.html">Volver al inicio</a>
        </nav>
        
    </header>

    <main>
        <section class = "tarjeta">
            
            <h2>Inicio de Sesión</h2>
                <form id="form-login" class="formulario">
                    <label for="usuario">Usuario:</label>
                    <input type="text" id="usuario" placeholder="Ingresa tu usuario">

                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" placeholder="Ingresa tu contraseña" required>

                    <button type="submit" class="boton">Iniciar Sesión</button>
                </form>
                <p id="mensaje-login" class="mensaje-error"></p>

        </section>
    </main>

    <footer class="pie">
        <p>Publicado con Github</p>
    </footer>

</body>

</html>
